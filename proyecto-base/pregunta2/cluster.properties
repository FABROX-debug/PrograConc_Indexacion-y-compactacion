# =====================================================================
#  Configuracion del cluster - Procesamiento de movimientos bancarios
#  Cada nodo es una computadora de la red con distinta capacidad de
#  procesamiento (hilos = nucleos) y de almacenamiento (disco.mb).
# =====================================================================
cluster.nombre=ClusterBancarioPeru
cluster.dir=cluster
repositorio.dir=repositorio

# Estrategia de balanceo: ROUND_ROBIN | PONDERADO | DINAMICO
balanceo.estrategia=PONDERADO

# Registros por bloque de trabajo (unidad que toma cada hilo de la cola)
bloque.registros=10000

# Umbral de operacion sospechosa en soles (Registro de Operaciones - UIF Peru)
umbral.sospechoso=30000

cluster.nodos=4

# Servidor principal de la sede Lima: el mas potente
nodo1.nombre=Servidor-Lima
nodo1.hilos=8
nodo1.disco.mb=192
nodo1.dir=cluster/nodo1

# PC de escritorio de la sede Arequipa
nodo2.nombre=PC-Arequipa
nodo2.hilos=4
nodo2.disco.mb=120
nodo2.dir=cluster/nodo2

# Laptop de la agencia Piura
nodo3.nombre=Laptop-Piura
nodo3.hilos=2
nodo3.disco.mb=144
nodo3.dir=cluster/nodo3

# PC antigua de la agencia Tumbes: la de menor capacidad
nodo4.nombre=PC-Tumbes
nodo4.hilos=1
nodo4.disco.mb=72
nodo4.dir=cluster/nodo4
